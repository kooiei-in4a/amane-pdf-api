name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf libjpeg-turbo-progs

      - name: Setup Go for binary metadata verification
        # Goはgo version -mの検証専用。aptでコンパイラのソースまで取得する待ち時間を避ける。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache: false

      - name: Install locked pdfcpu and Japanese font
        run: |
          scripts/install-pdfcpu.sh "$RUNNER_TEMP/pdfcpu"
          echo "Pdf__PdfcpuPath=$RUNNER_TEMP/pdfcpu/bin/pdfcpu" >> "$GITHUB_ENV"
          echo "Pdf__PdfcpuConfigDir=$RUNNER_TEMP/pdfcpu/config" >> "$GITHUB_ENV"
          python3 scripts/verify-pdfcpu-modules.py "$RUNNER_TEMP/pdfcpu/bin/pdfcpu"

      - name: Prepare host qpdf
        # Ubuntu's /usr/bin/qpdf AppArmor profile permits only .pdf/.json outputs,
        # whereas qpdf itself generates extensionless raw stream files. Use the
        # same packaged binary outside that path for host tests; Docker uses qpdf.
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-tools"
          cp /usr/bin/qpdf "$RUNNER_TEMP/pdf-tools/qpdf"
          echo "$RUNNER_TEMP/pdf-tools" >> "$GITHUB_PATH"

      - name: Verify JPEG options with real conversion
        run: /usr/bin/python3 scripts/compress-validation.py --tools

      - name: Verify Linux memory limiter
        run: prlimit --version && test -r /usr/share/doc/util-linux/copyright

      - name: Verify qpdf version
        run: qpdf --version | grep -Eq '^qpdf version (1[2-9]|[2-9][0-9])\.'

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PDF and CI-only rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils python3-pil python3-numpy

      - name: Setup .NET for the existing test harness
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build overlay drawing comparison harness
        run: dotnet build --configuration Release

      - name: Docker build
        run: docker build -t amane-pdf-api:ci .

      - name: Docker E2E smoke (1.5 GiB, no swap, CPU 1, tmpfs 256 MiB)
        run: /usr/bin/python3 scripts/docker-smoke.py amane-pdf-api:ci

      - name: Compare PDF structure, streams and rendering (CI tools only)
        run: /usr/bin/python3 scripts/compress-validation.py --render amane-pdf-api:ci

      - name: Verify Japanese text extraction and embedded font (CI tools only)
        run: /usr/bin/python3 scripts/pdfcpu-validation.py amane-pdf-api:ci

      - name: Compare real overlay text and original rendering (CI tools only)
        run: /usr/bin/python3 scripts/overlay-validation.py amane-pdf-api:ci --render
