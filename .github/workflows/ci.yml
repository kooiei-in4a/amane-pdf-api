name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf && qpdf --version

      - name: Verify qpdf version
        run: qpdf --version | grep -Eq '^qpdf version (1[2-9]|[2-9][0-9])\.'

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Docker build
        run: docker build -t amane-pdf-api:ci .

      - name: Docker E2E smoke
        run: python3 scripts/docker-smoke.py amane-pdf-api:ci
